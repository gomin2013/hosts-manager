excluded:
  - .build
  - scripts      # one-off tooling scripts
  - .git
  - .claude
  - .github
  - Tests/LinuxMain.swift

opt_in_rules:
  - empty_count
  - for_where
  - redundant_nil_coalescing
  - sorted_first_last
  - trailing_newline

disabled_rules:
  - trailing_comma

identifier_name:
  min_length: 2
  max_length: 40
  excluded:
    - id
    - en
    - th
    - vm
    - ui

type_body_length:
  warning: 400
  error: 500

file_length:
  warning: 400
  error: 600

line_length:
  warning: 120
  error: 150
  ignores_comments: true
  ignores_urls: true

function_body_length:
  warning: 50
  error: 80

cyclomatic_complexity:
  warning: 10
  error: 15

nesting:
  type_level: 2
  function_level: 3

trailing_newline:
  severity: error
